name: Android framework checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: ["36", "37.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare the official emulator and target platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
          echo no | avdmanager create avd --name textkeep-ci --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_6
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Build synthetic test APKs
        run: apps/android/gradlew -p apps/android assembleDebug assembleDebugAndroidTest --no-daemon -Pkotlin.compiler.execution.strategy=in-process
      - name: Verify framework recovery, the SMS role and offline copy
        run: |
          set -euo pipefail
          mkdir -p .private
          "$ANDROID_HOME/emulator/emulator" -avd textkeep-ci -no-window -no-snapshot -no-boot-anim -no-audio -gpu software -cores 2 -memory 3072 > .private/emulator.log 2>&1 &
          TEXTKEEP_EMULATOR_PID=$!
          trap 'adb logcat -d -v threadtime > .private/framework-logcat.log 2>&1; kill "$TEXTKEEP_EMULATOR_PID" 2>/dev/null || true' EXIT
          timeout 120 adb wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install apps/android/app/build/outputs/apk/debug/app-debug.apk
          adb install apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          node scripts/android-durability.mjs emulator-5554 --sms | tee .private/framework-tests.log
      - name: Preserve synthetic test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-framework-${{ matrix.api }}
          path: .private/*.log
          include-hidden-files: true
          retention-days: 7
