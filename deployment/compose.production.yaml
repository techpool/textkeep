services:
  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    expose: ["3000"]
    environment:
      APP_ENV: production
      PORT: 3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CLOUDFLARE_PROXY_CIDRS: ${CLOUDFLARE_PROXY_CIDRS:-}
      DATABASE_URL: ${DATABASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_WEB_CONFIG: ${FIREBASE_WEB_CONFIG}
      GOOGLE_APPLICATION_CREDENTIALS: /run/textkeep/firebase-admin.json
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-allowlist}
      OWNER_FIREBASE_UID: ${OWNER_FIREBASE_UID:-}
      OWNER_GOOGLE_EMAIL: ${OWNER_GOOGLE_EMAIL:-}
      MESSAGE_ENCRYPTION_KEYRING: ${MESSAGE_ENCRYPTION_KEYRING}
      ACTIVE_MESSAGE_KEY_ID: ${ACTIVE_MESSAGE_KEY_ID:-v1}
      LOOKUP_HMAC_KEY: ${LOOKUP_HMAC_KEY}
      OAUTH_JWKS: ${OAUTH_JWKS}
      APK_PATH: ${APK_PATH:-/run/textkeep/textkeep.apk}
      RELEASE_METADATA_PATH: ${RELEASE_METADATA_PATH:-/run/textkeep/release.json}
    volumes:
      - /data/textkeep/private:/run/textkeep:ro
    networks: [database]
    mem_limit: 768m
    cpus: 1
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  database:
    external: true
    name: ${DATABASE_NETWORK}
